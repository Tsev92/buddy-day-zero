name: Publish Buddy Day Zero
on:
  push:
    branches: [main]
    paths: [release-request.txt]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to package
        required: true
        default: '0.23.4'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive and checksum
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, zipfile
          version = pathlib.Path("VERSION.txt").read_text().strip()
          tag = os.environ['RELEASE_TAG'] or ('v' + version)
          if tag.lstrip('v') != version:
              raise SystemExit(f"Tag {tag} does not match version {version}")
          files = ["app.py", "update_helper.py", "requirements.txt",
                   "start_buddy.bat", "start_buddy_silent.vbs", "VERSION.txt"]
          files += [str(p) for p in pathlib.Path("buddy").rglob("*.py")]
          for name in files:
              if not pathlib.Path(name).is_file():
                  raise SystemExit(f"Missing required file: {name}")
          with zipfile.ZipFile("buddy-day-zero-update.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in files:
                  archive.write(name)
          digest = hashlib.sha256(pathlib.Path("buddy-day-zero-update.zip").read_bytes()).hexdigest()
          pathlib.Path("buddy-manifest.json").write_text(
              json.dumps({"version": version, "sha256": digest}, indent=2)
          )
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          TAG="${RELEASE_TAG:-v$(cat VERSION.txt)}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" buddy-day-zero-update.zip buddy-manifest.json --clobber
          else
            gh release create "$TAG" buddy-day-zero-update.zip buddy-manifest.json --target "$GITHUB_SHA" --title "Buddy Day Zero $TAG" --generate-notes
          fi
