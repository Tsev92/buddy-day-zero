name: Verify Buddy presentation
on:
  push:
    branches: [main]
    paths:
      - 'buddy/**'
      - 'tests/**'
      - '.github/workflows/verify.yml'
      - 'app.py'
      - 'update_helper.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependency
        run: python -m pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall -q app.py buddy update_helper.py tests
      - name: Run presentation smoke tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
